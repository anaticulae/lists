[build-system]
requires = [
    "setuptools>=83.0.0",
    "wheel>=0.47.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "indicibus"
version = "0.3.2"
description = ""
requires-python = ">=3.12"
authors = [
    { name = "Helmut Konrad Schewe", email = "helmutus@outlook.com" },
]
dependencies = [
    "utilo>=2.109.1,<3.0.0",
    "iamraw>=4.93.0,<5.0.0",
    "geostrat>=1.5.1,<2.0.0",
]
keywords = []
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
license = "MIT"
license-files = [
    "LICENSE",
]

[project.readme]
file = "README"
content-type = "text/markdown"

[project.optional-dependencies]
dev = [
    "capita>=1.25.3,<2.0.0",
    "capita-ref>=1.0.1,<2.0.0",
    "captions>=1.0.1,<2.0.0",
    "codero>=1.0.1,<2.0.0",
    "figureo>=1.0.1,<2.0.0",
    "gennex>=1.1.0,<2.0.0",
    "groupmes>=1.1.0,<2.0.0",
    "headnote>=1.0.3,<2.0.0",
    "hoverpower>=1.6.0,<2.0.0",
    "ibidem>=1.0.2,<2.0.0",
    "mundare>=1.0.2,<2.0.0",
    "pagenumber>=1.0.0,<2.0.0",
    "rawmaker>=2.40.5,<3.0.0",
    "tablero>=1.0.1,<2.0.0",
    "titulum>=1.0.2,<2.0.0",
    "utilotest>=1.0.5,<2.0.0",
]

[project.urls]
Homepage = "https://github.com/anaticulae/smarty"
Repository = "https://github.com/anaticulae/smarty"

[project.scripts]
lists = "lists.cli:main"

[tool.semantic_release]
version_toml = [
    "pyproject.toml:project.version",
]

[tool.semantic_release.changelog]
mode = "init"
output_format = "md"

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG"

[tool.semantic_release.commit_parser_options]
patch_tags = [
    "build",
    "chore",
    "ci",
    "deps",
    "docs",
    "fix",
    "perf",
    "refactor",
    "style",
    "test",
]
minor_tags = [
    "feat",
]

[tool.setuptools.packages.find]
where = [
    ".",
]
include = [
    "lists",
    "lists.features",
    "lists.strategies",
]
exclude = [
    "tests*",
]

[tool.hoverpower]
packages = [
    "BACHELOR",
    "BOOK",
    "DISS",
    "DOCU",
    "MASTER",
]
